[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wathiq-araseg-service"
version = "0.1.0"
description = "Wathiq AraSeg AI service."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "torch>=2.11,<2.12",
    "transformers>=4.45,<4.46",
    "uvicorn>=0.30,<0.31",
    "safetensors>=0.7,<0.8",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<0.29",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
